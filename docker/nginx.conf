server_tokens off;

limit_req_zone $binary_remote_addr zone=contact:1m rate=1r/m;

map "$request_method $uri" $method_allowed {
    default 0;
    "~^(?:GET|HEAD) " 1;
    "POST /_actions/contact" 1;
}

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /srv/portfolio;
    charset utf-8;
    absolute_redirect off;
    client_max_body_size 1k;

    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css text/plain text/xml application/javascript application/json application/xml application/manifest+json image/svg+xml;

    error_page 404 /404.html;

    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header CF-Connecting-IP;

    resolver 127.0.0.11 valid=30s ipv6=off;
    resolver_timeout 2s;

    if ($method_allowed = 0) {
        return 405;
    }

    location = / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files /index.html =404;
    }

    location = /index {
        return 301 /;
    }

    location = /index.html {
        return 301 /;
    }

    location = /_actions/contact {
        limit_req zone=contact burst=3 nodelay;
        limit_req_status 429;
        error_page 429 = @contact_rate_limited;
        client_max_body_size 32k;

        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;

        set $contact_upstream http://contact:4321;
        proxy_pass $contact_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 2s;
        proxy_read_timeout 15s;
    }

    location @contact_rate_limited {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
        default_type application/json;
        return 429 '{"type":"AstroActionError","code":"TOO_MANY_REQUESTS","status":429}';
    }

    location = /404.html {
        internal;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    location ^~ /_astro/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=86400" always;
    }

    location ~ /\. {
        return 404;
    }

    location ~ ^(?<page>/.+)\.html$ {
        return 301 $page$is_args$args;
    }

    location ~ ^(?<page>/.+)/$ {
        return 301 $page$is_args$args;
    }

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri.html =404;
    }

    location ~* \.(?:ico|png|svg|txt|xml)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri =404;
    }
}
